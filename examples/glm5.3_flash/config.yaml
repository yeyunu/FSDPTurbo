# ============================================================
# GLM-5.3-flash Training Configuration
# ============================================================

# --- Model Configuration ---
model:
  model_name_or_path: "zai-org/GLM-5.3-flash"
  tokenizer_name_or_path: "zai-org/GLM-5.3-flash"
  torch_dtype: "bf16"
  # Fused lightning indexer (cann_ops_transformer): on-chip DSA scoring + pool
  # top-k, replacing the eager [B, S, NH, P] fp32 score tensor (the 32k OOM
  # source). NPU-only (hard ImportError without the CANN env); the eager path
  # stays the default on CPU/GPU. INCOMPATIBLE with dsa_implementation: 'sfa'
  # (the op cannot guarantee an all-valid pool selection, which SFA's packed
  # indices require) -- use indexer_implementation: 'triton' there instead.
  use_fused_lightning_indexer: false
  # Indexer scoring implementation. 'triton' (lightning_indexer_score) also
  # avoids the eager [B, S, NH, P] score tensor AND applies the validity gate
  # on-chip, keeping every packed row dense up to the span that
  # npu_sparse_flash_attention's backward reads -- required for
  # dsa_implementation: 'sfa'.
  indexer_implementation: "triton"
  # DSA attention implementation. 'sfa' consumes the indexer's top-k indices
  # with npu_sparse_flash_attention (no dense [B, S, kv_len] mask, which alone
  # is 64 GiB at 128k and OOMs); 'dense' builds the mask. Works with Ulysses
  # CP (the CP wrapper gathers the shared latent and shards only the query).
  dsa_implementation: "sfa"
  # NPU fused-attention dispatch (MLA/DSA text attention and the vision
  # tower): 1 routes through npu_fusion_attention (BNSD layout), 0 keeps the
  # bit-exact eager path (loss / grad_norm alignment runs).
  npu_fused_attention: 1

# --- Optimizer Configuration ---
optimizer:
  optimizer_type: "AdamW"
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  lr: 5.0e-5
  warmup_ratio: 0.1
  lr_scheduler_type: "CosineAnnealingLR"
  min_lr: 3.0e-6
  clip_grad: 1.0
  clip_grad_norm_type: 2.0

# --- Run Configuration ---
run:
  seed: 42
  max_steps: 100
  num_train_epochs: 1
  gradient_accumulation_steps: 1
  logging_steps: 1
  profile:
    enabled: false
    wait_steps: 0
    warmup_steps: 0
    active_steps: 10
    repeat: 1
    skip_first: 0
    output_dir: "./profile"
    record_shapes: false
    profile_memory: false
    with_stack: false

# --- Checkpoint Configuration ---
checkpoint:
  output_dir: "./output/glm-5.3-Flash"
  save_steps: 10000
  strict: true
  save_optim: true
  load_optim: true
  resume_from_checkpoint: null

# --- Data Configuration ---
data:
  dataset_path: "/home/dataset/coco/llava_instruct_150k_fsdp_turbo_100.json"
  dataset_config: null
  text_column: "text"
  image_column: "images"
  media_key: "medias"  # codespell:ignore
  use_data_balance: false
  conversation_column: "messages"
  split: "train"
  batch_size: 1
  max_seq_length: 2048
  num_workers: 8
  pin_memory: true
  shuffle: false
  is_multimodal: true

# --- Distributed Configuration ---
distributed:
  data_parallel_size: 1
  fully_shard_parallel_size: 16
  tensor_parallel_size: 1
  # Ulysses CP splits the fused sequence across these ranks: 2 with
  # world_size 8 (DP×FSDP stays 8; ulysses is carved inside the same mesh).
  # The Ulysses forwards are built into the modeling classes (Glm5NextModel /
  # Glm5NextTextAttention / Glm5NextTextLinearAttention), so no extra patches
  # are required.
  ulysses_parallel_size: 1
  # KCP is disabled by default. To enable it, set this value above 1 and
  # set ulysses_parallel_size to 1 because KCP and Ulysses are mutually exclusive.
  kcp_parallel_size: 1
  expert_parallel_size: 16
  expert_fully_shard_parallel_size: 1
  expert_data_parallel_size: 1

  # --- FSDP Plan ---
  # NOTE: apply_modules is a mapping of module pattern -> per-module FSDP
  # options (empty dict = defaults), not a flat list. Do NOT add the parent
  # module (model.language_model) here: modules are wrapped in pre-order, so
  # the parent would shard the layers' params first and the layers.{*} entry
  # would then fail with "Cannot concatenate overlapping meshes". Leftover
  # params (norms/router) are sharded by the root-level fully_shard call.
  fsdp_plan:
    apply_modules:
      model.visual:
        {}
      model.language_model.embed_tokens:
        {}
      model.language_model.layers.{*}:
        {}
      model.language_model.lm_head:
        {}
    hook_modules:
      - model.language_model.layers.{*}
    param_dtype: bf16
    reduce_dtype: fp32
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1


  ep_plan:
    apply_modules:
      - model.language_model.layers.{*}.mlp.experts
    # GLM5Next experts store fused 3D weights and use a limited swiglu, so use
    # the model-specific EP forward implemented on Glm5NextTextExperts
    # (ep_forward_eager / ep_forward_fused) instead of the generic dispatchers.
    dispatcher: custom_ep_forward_eager
    fixed_router: false

  # --- Context Parallel Plan ---
  # Only the patch set whose parallel size is greater than 1 is applied.
  cp_plan:
    # GLM-5.3-Flash's Ulysses forwards are built into the modeling classes
    # (Glm5NextModel / Glm5NextTextAttention / Glm5NextTextLinearAttention),
    # so no attention-side function patches are needed here; only the CP-aware
    # loss (global shift, per-shard logits, global token-count normalisation)
    # is patched.
    loss_function_patches:
      - target_functions:
          - transformers.loss.loss_utils.ForCausalLMLoss
        type: causal_lm_loss

# --- Memory Configuration ---
memory:
  recompute: true
  recompute_plan:
    # Vision tower (runs on the full sequence under Ulysses CP).
    - model.visual.blocks.{*}
    # LM decoder layers (run on the local CP shard; one unit per layer).
    - model.language_model.layers.{*}

features:
  # Chunked lm_head loss: computes loss in chunks through lm_head so the full
  # [B, S, vocab] logits are never materialized. Orthogonal to memory.recompute;
  # works with Ulysses CP too (the model forward has a combined CP path).
  chunk_loss: true
  chunk_loss_size: 512
