# ============================================================
# DeepSeekV4 Training Configuration
# ============================================================

# --- Feature toggles ---
# Enable via YAML; train.py reads this section at runtime.
features:
  swap_activation: false
  swap_activation_plan:
    - model.layers.{*}
  swap_optimizer: false
  chunk_loss: false
  chunk_loss_size: 512

# --- Model Configuration ---
model:
  model_name_or_path: "deepseek-ai/DeepSeek-V4-Flash"
  tokenizer_name_or_path: "./tokenizer/"
  torch_dtype: "bf16"

# --- Optimizer Configuration ---
optimizer:
  optimizer_type: "AdamW"
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  lr: 3.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "CosineAnnealingLR"
  min_lr: 3.0e-5
  clip_grad: 1.0

# --- Run Configuration ---
run:
  seed: 42
  deterministic: true
  max_steps: -1
  num_train_epochs: 1
  gradient_accumulation_steps: 1
  logging_steps: 1
  profile:
    enabled: false
    wait_steps: 0
    warmup_steps: 0
    active_steps: 1
    repeat: 1
    skip_first: 0
    output_dir: "./profile"
    record_shapes: false
    profile_memory: false
    with_stack: false
  # Device memory snapshot collection (0-based micro steps; the window is
  # inclusive on both ends).
  memory_snapshot:
    enable: false        # true: record allocator history from start_step and dump at end_step
    start_step: 1
    end_step: 2          # the single dump step; without it one snapshot per step from start_step
    save_path: ./memory_snapshot  # None -> <checkpoint.output_dir>/memory_snapshot
    dump_ranks: [0]      # ranks that record and dump; null/omitted -> all ranks
    stacks: all          # allocation stack scope: all / python
    max_entries: null    # allocator history entry cap; null -> unbounded
    mem_info: false      # per-step memory stats line (independent of enable)

# --- Checkpoint Configuration ---
checkpoint:
  output_dir: "./output"
  save_steps: 500
  strict: true
  save_optim: true
  load_optim: true
  resume_from_checkpoint: null

# --- Data Configuration ---
data:
  dataset_path: "Salesforce/wikitext"
  dataset_config: "wikitext-2-raw-v1"
  text_column: "text"
  split: "train"
  batch_size: 1
  max_seq_length: 1024
  num_workers: 8
  pin_memory: true
  shuffle: false

# --- Distributed Configuration ---
distributed:
  data_parallel_size: 1
  fully_shard_parallel_size: 8
  tensor_parallel_size: 1
  kv_allgather_parallel_size: 2
  ulysses_parallel_size: 2
  expert_parallel_size: 4
  expert_fully_shard_parallel_size: 1
  expert_data_parallel_size: 1

  # --- FSDP Plan ---
  fsdp_plan:
    ignored_modules: []
    apply_modules:
      model.layers.{*}:
        {}
      model.embed_tokens:
        {}
      lm_head:
        {}
    param_dtype: "bf16"
    reduce_dtype: "fp32"
    output_dtype: "bf16"
    cast_forward_inputs: true
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
    hook_modules:
      - model.layers.{*}
    fsdp_implementation: "native"

  # --- Tensor Parallel Plan ---
  tp_plan:
    colwise_parallel: []
    rowwise_parallel: []
    sequence_parallel: []

  # --- Expert Parallel Plan ---
  ep_plan:
    apply_modules:
      - model.layers.{*}.mlp.experts
    dispatcher: "all2all"
    use_fused_ops: true
    apply_efsdp_modules:
      - model.layers.{*}.mlp.experts

  cp_plan:
    ulysses_function_patches:
     - target_functions:
         - transformers.models.deepseek_v4.modeling_deepseek_v4.eager_attention_forward
       type: compressor_full_attention_transposed
    kv_allgather_function_patches:
     - target_functions:
         - transformers.models.deepseek_v4.modeling_deepseek_v4.eager_attention_forward
       type: compressor_full_attention
    loss_function_patches:
     - target_functions:
         - transformers.loss.loss_utils.ForCausalLMLoss
       type: causal_lm_loss

# --- Memory Configuration ---
memory:
  recompute: true
  recompute_plan:
    - model.layers.{*}

# --- Quantization Configuration ---
quantization:
  quantization_plan: null
