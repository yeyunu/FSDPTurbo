# ============================================================
# DeepSeek-V4.1-Flash Text Training Configuration
# ============================================================

# --- Model Configuration ---
model:
  # --- Optional TileKernels backend (independent from model fused operators) ---
  tilekernels:
    tilekernels_mhc_post: false
    # Add future operator switches here after separate validation.

  model_name_or_path: "./DSV41/models/DeepSeek-V4.1-Flash"
  # Optional architecture JSON override; otherwise read model_name_or_path/config.json.
  config_path: "./model_config/config_8p_A5.json"
  tokenizer_name_or_path: "./DSV41/models/DeepSeek-V4.1-Flash"
  torch_dtype: "bf16"
  # Head projection precision: fp32, bf16, or hf32 (NPU); cross entropy remains FP32.
  head_compute_dtype: "bf16"
  engram_storage_backend: "elastic_buffer"
  # Use CANN SparseFlashMla/SparseFlashMlaGrad instead of eager indexed attention.
  use_sparse_flash_attn: true
  # Use QuantLightningIndexer/QuantSparseLightningIndexer on Ascend950DT.
  # Ascend 910B/910C/910_93 candidate indexers are not supported yet.
  use_fused_lightning_indexer: true
  # Use CANN Compressor/CompressorGrad for compressed-KV pooling.
  use_fused_compressor: true
  # Use CANN MhcPreSinkhornPremix/MhcPost training kernels.
  use_fused_mhc: true
  # Use the triton in-place RoPE kernel (mindspeed_ops.api.triton.inplace_rope)
  # over the trailing rotary block on NPU.
  use_triton_inplace_rope: true
  # Use CANN FlashAttn/FlashAttnGrad for full bidirectional vision attention.
  use_fused_vision_flash_attn: true
  # Use CANN InplacePartialRotaryMul/Grad for the large per-layer q/o RoPE.
  # cos/sin become bf16 (the operator needs the input dtype), ~0.6% relative
  # change against the fp32 complex path -- A/B the loss curve before enabling.
  use_fused_partial_rotary: false
  # Fuse the Engram n-gram memory gating via the PyPTO-Pro kernels (Ascend950DT);
  # falls back to eager torch when pypto_pro is unavailable.
  use_fused_engram: false

# --- Optimizer Configuration ---
optimizer:
  optimizer_type: "AdamW"
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  lr: 3.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "CosineAnnealingLR"
  min_lr: 3.0e-5
  clip_grad: 1.0

# --- Run Configuration ---
run:
  seed: 42
  deterministic: false
  max_steps: -1
  num_train_epochs: 1
  gradient_accumulation_steps: 1
  logging_steps: 1
  profile:
    enabled: true
    wait_steps: 1
    warmup_steps: 1
    active_steps: 1
    repeat: 1
    skip_first: 5
    output_dir: "./DSV41/profiles/dsv41_8p"
    record_shapes: true
    profile_memory: false
    with_stack: false
  # Device memory snapshot collection (0-based micro steps; the window is
  # inclusive on both ends).
  memory_snapshot:
    enable: false        # true: record allocator history from start_step and dump at end_step
    start_step: 1
    end_step: 2          # the single dump step; without it one snapshot per step from start_step
    save_path: ./memory_snapshot  # None -> <checkpoint.output_dir>/memory_snapshot
    dump_ranks: [0]      # ranks that record and dump; null/omitted -> all ranks
    stacks: all          # allocation stack scope: all / python
    max_entries: null    # allocator history entry cap; null -> unbounded
    mem_info: false      # per-step memory stats line (independent of enable)

# --- Checkpoint Configuration ---
checkpoint:
  output_dir: "./output"
  save_steps: 500
  strict: true
  save_optim: true
  load_optim: true
  resume_from_checkpoint: null

# --- Data Configuration ---
data:
  dataset_path: "./DSV41/datasets/mock/mock_data_pic_num_2_textlen_4096.jsonl"
  dataset_config: null
  text_column: "text"
  image_column: "images"
  conversation_column: "messages"
  media_key: "images"
  split: "train"
  batch_size: 1
  max_seq_length: 4096
  num_workers: 8
  pin_memory: true
  shuffle: false
  is_multimodal: true

# --- Distributed Configuration ---
distributed:
  data_parallel_size: 1
  fully_shard_parallel_size: 8
  tensor_parallel_size: 1
  kv_allgather_parallel_size: 1
  ulysses_parallel_size: 1
  expert_parallel_size: 8
  expert_fully_shard_parallel_size: 1
  expert_data_parallel_size: 1

  # --- FSDP Plan ---
  fsdp_plan:
    ignored_modules: []
    apply_modules:
      model.layers.{*}:
        {}
      # The vision blocks are individually too light to hide one cross-node AG.
      # Treat the complete tower as one FSDP unit to batch parameter unsharding.
      model.vision:
        {}
      model.aligner:
        {}
      model.embed:
        {}
      model.head:
        {}
    param_dtype: "bf16"
    reduce_dtype: "fp32"
    # Preserve heterogeneous block outputs: BF16 hidden states and FP32 HC
    # pre-mix coefficients. Casting the whole tuple to BF16 changes layer N+1.
    output_dtype: null
    # DeepSeek controls numerical dtypes inside the model. In particular,
    # blanket casting would truncate FP32 HC pre-mix coefficients to BF16.
    cast_forward_inputs: false
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
    prefetch_modules:
      - model.embed
      - model.vision
      - model.aligner
      - model.layers.{*}
      - model.head
    hook_modules:
      - model.layers.{*}
      - model.vision
    fsdp_implementation: "custom"

  # --- Tensor Parallel Plan ---
  # V4.1 attention retains replicated heads because its attention sink and
  # indexed sparse-attention layout require a model-specific head sharder.
  # Split the shared SwiGLU expert over its intermediate dimension instead.
  tp_plan:
    colwise_parallel:
      - model.layers.{*}.ffn.shared_experts.w1
      - model.layers.{*}.ffn.shared_experts.w3
    rowwise_parallel:
      - model.layers.{*}.ffn.shared_experts.w2
    sequence_parallel: []

  # --- Expert Parallel Plan ---
  ep_plan:
    apply_modules:
      - model.layers.{*}.ffn.experts
    dispatcher: "all2all"
    use_fused_ops: true
    fixed_router: true
    apply_efsdp_modules:
      - model.layers.{*}.ffn.experts

  cp_plan:
    ulysses_function_patches: []
    kv_allgather_function_patches: []
    loss_function_patches: []

# --- Memory Configuration ---
memory:
  # Split the output projection and loss along the sequence axis.
  chunk_loss: false
  chunk_loss_size: 512
  # V4.1 attention shares runtime state between layers. Recompute requires a
  # model-specific state capture and is intentionally disabled in this adapter.
  recompute: false
  recompute_plan:
    - model.layers.{*}.ffn

# --- Quantization Configuration ---
quantization:
  quantization_plan: null
