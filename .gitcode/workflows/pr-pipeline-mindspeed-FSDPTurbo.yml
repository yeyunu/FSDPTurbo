name: PR-pipeline_FSDPTurbo

concurrency:
  enable: true
  max: 3
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

on:
  pr_comment:
    types: [created]
    keyword: '^compile$'
  pull_request_comment:
    types: [created]
    branches: ['*']
    comments: ['^compile$']

env:
  TARGET_BRANCH: ${{ atomgit.event.pull_request.base.ref || atomgit.base_ref || 'main' }}
  pr_id: ${{ atomgit.event.pull_request.number || atomgit.event.issue.number }}
  org_name: Ascend

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write
  action: read

stages:
  stage1:
    name: only_doc
    select: selected_by_default
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [self-hosted, default, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
        outputs:
          need_build_ut: ${{ steps.set-skip.outputs.need_build_ut }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
              token: ${{ secrets.GIT_TOKEN }}
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: pull_request
              base: ${{ env.TARGET_BRANCH }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ atomgit.ATOMGIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'
          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "non-doc: ${{ steps.filter.outputs.non-doc }}"
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ]; then
                echo "need_build_ut=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build_ut=no" >> "$ATOMGIT_OUTPUT"
              fi

      associate_pr_comment:
        name: associate_pr_comment
        select: selected_by_default
        runs-on: [self-hosted, default, x86, cpu=16]
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment
          - name: pre_pipeline
            id: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
            with:
              owner: ${{ env.org_name }}
              repo: ${{ atomgit.event.repository.name }}
              pr_number: ${{ env.pr_id }}
              token: ${{ secrets.GIT_TOKEN }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.org_name }}/${{ atomgit.event.repository.name }}/actions/runs/${{ atomgit.workflow_run_id }}

  stage2:
    name: CodeCheck
    select: selected_by_default
    jobs:
      CodeCheck_pre_commit:
        name: CodeCheck_pre_commit
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, default, x86, cpu=16]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
        steps:
          - name: checkout
            uses: checkout
            with:
              token: ${{ secrets.GIT_TOKEN }}
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: setup-python311
            run: |
              PYTHON_BIN=$(which python3.11 || which python3)
              PYTHON_BIN_DIR=$(dirname "$PYTHON_BIN")
              ln -sf "$PYTHON_BIN" "$PYTHON_BIN_DIR/python"
              echo "$PYTHON_BIN_DIR" >> "$ATOMGIT_PATH"
              python --version
          - name: install gitleaks
            run: |
              cd "${ATOMGIT_WORKSPACE}"
              wget --no-host-directories -O gitleaks https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  gitleaks" | sha256sum -c -
              chmod +x gitleaks
              cd -
          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0
            env:
              SKIP: clang-tidy

      sca-pr:
        name: SCA
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, default, x86, cpu=16]
        steps:
          - name: checkout
            uses: checkout
            with:
              token: ${{ secrets.GIT_TOKEN }}
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: MindSpeed

      malicious-scan:
        name: AntiPoison
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, default, x86, cpu=16]
        steps:
          - name: checkout
            uses: checkout
            with:
              token: ${{ secrets.GIT_TOKEN }}
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              allow-unsafe-pr-checkout: true
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              repository-name: ${{ atomgit.repository }}
              pr-id: ${{ env.pr_id }}
              project-name: MindSpeed
              rule: Python

  stage3:
    name: UT-ST
    select: selected_by_default
    jobs:
      UT_ST:
        name: UT-ST
        if: ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [self-hosted, fsdpturbo, npu=8]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/mindspeed/pr-fsdpturbo:910b-openeuler24.03-py3.11-aarch64-0814
        steps:
          - name: checkout
            uses: checkout
            with:
              token: ${{ secrets.GIT_TOKEN }}
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              path: CODE
              fetch-depth: 0
          - name: run UT-ST
            run: |
              set -e
              echo "start FSDPTurbo UT&ST: CPU UT first, then single-node 8-card ST with baseline comparison"
              if [ -f /usr/local/Ascend/ascend-toolkit/set_env.sh ]; then
                source /usr/local/Ascend/ascend-toolkit/set_env.sh
              elif [ -f /usr/local/Ascend/cann/set_env.sh ]; then
                source /usr/local/Ascend/cann/set_env.sh
              else
                echo "WARNING: no Ascend set_env.sh found; relying on image default env"
              fi
              bash "${ATOMGIT_WORKSPACE}/CODE/ci/MindSpeed_FSDPTurbo_ut.sh" "${ATOMGIT_WORKSPACE}" "${{ env.pr_id }}" "${{ env.TARGET_BRANCH }}"

post:
  jobs:
    query_pipeline:
      steps:
        - name: query_pipeline
          id: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
          with:
            owner: ${{ env.org_name }}
            repo: ${{ atomgit.event.repository.name }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ env.pr_id }}
            apply_label: 'true'
